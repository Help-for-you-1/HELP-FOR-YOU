<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HELP FOR YOU | Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#061a40,#0b62bd);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(460px,100%);background:#fff;border-radius:18px;padding:28px;box-shadow:0 18px 50px #0004}.brand{text-align:center;color:#073b8f;font-size:28px;font-weight:800}.sub{text-align:center;color:#667085;margin:8px 0 22px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}.roles button{border:1px solid #d8e0ea;background:#f7f9fc;padding:12px 5px;border-radius:8px;font-weight:700;cursor:pointer}.roles button.active{background:#0754b8;color:#fff}.form{display:none}.form.active{display:block}label{display:block;font-size:13px;font-weight:700;margin:14px 0 5px}input{width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:8px;font-size:15px}.login{width:100%;margin-top:20px;background:#0754b8;color:#fff;border:0;border-radius:8px;padding:13px;font-weight:700;cursor:pointer}.login:disabled{opacity:.65}.back{display:block;text-align:center;margin-top:18px;color:#0754b8;text-decoration:none}.msg{margin-top:12px;text-align:center;font-size:13px;color:#b42318;min-height:18px}@media(max-width:420px){.roles{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div class="box"><div class="brand">HELP FOR YOU</div><div class="sub">Secure Portal Login</div><div class="roles"><button onclick="selectRole('admin',this)">Admin</button><button onclick="selectRole('staff',this)">Staff</button><button onclick="selectRole('customer',this)">Customer</button></div><div id="admin" class="form active"><h3>Admin Login</h3><label>Gmail / Email</label><input id="adminEmail" type="email" placeholder="Enter Gmail / Email" autocomplete="username"><label>Password</label><input id="adminPassword" type="password" placeholder="Enter password" autocomplete="current-password"><button id="adminLoginBtn" class="login" onclick="adminLogin()">Login as Admin</button><div id="loginMsg" class="msg"></div></div><div id="staff" class="form"><h3>Staff Login</h3><label>User ID</label><input id="staffId" placeholder="Enter User ID" autocomplete="username"><label>Password</label><input id="staffPassword" type="password" placeholder="Enter password" autocomplete="current-password"><button id="staffLoginBtn" class="login" onclick="staffLogin()">Login as Staff</button><div id="staffMsg" class="msg"></div></div><div id="customer" class="form"><h3>Customer Login</h3><label>Email / Mobile</label><input id="customerId" placeholder="Enter email or mobile"><button class="login" onclick="alert('Customer login will be connected to the customer portal.')">Login as Customer</button></div><a class="back" href="index.html">← Back to Home</a></div><script>const SUPABASE_URL='https://bvyruwvvlubgqficjblq.supabase.co';const SUPABASE_KEY='sb_publishable_Tet-jboVRqYRD5DpaQYAHw_XT-Er47t';const authClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);function selectRole(r,b){document.querySelectorAll('.form').forEach(x=>x.classList.remove('active'));document.getElementById(r).classList.add('active');document.querySelectorAll('.roles button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}async function adminLogin(){const e=document.getElementById('adminEmail').value.trim(),p=document.getElementById('adminPassword').value,btn=document.getElementById('adminLoginBtn'),msg=document.getElementById('loginMsg');msg.textContent='';if(!e||!p){msg.textContent='Email and password are required.';return}btn.disabled=true;btn.textContent='Signing in...';try{const{data,error}=await authClient.auth.signInWithPassword({email:e,password:p});if(error)throw error;const{data:isAdmin,error:ae}=await authClient.rpc('is_admin');if(ae)throw ae;if(!isAdmin){await authClient.auth.signOut();throw new Error('This account is not authorized as an admin.')}sessionStorage.setItem('hfy_admin','true');location.href='admin.html'}catch(err){console.error(err);msg.textContent=err.message||'Login failed.';btn.disabled=false;btn.textContent='Login as Admin'}}async function staffLogin(){const id=document.getElementById('staffId').value.trim(),p=document.getElementById('staffPassword').value,btn=document.getElementById('staffLoginBtn'),msg=document.getElementById('staffMsg');msg.textContent='';if(!id||!p){msg.textContent='User ID and password are required.';return}btn.disabled=true;btn.textContent='Signing in...';try{const{data,error}=await authClient.rpc('hfy_staff_login',{p_login_id:id,p_password:p});if(error)throw error;if(!data||data.success!==true)throw new Error(data&&data.message?data.message:'Invalid Staff User ID or password.');sessionStorage.setItem('hfy_staff',JSON.stringify(data));location.href='staff.html'}catch(err){console.error(err);msg.textContent=err.message||'Staff login failed.';btn.disabled=false;btn.textContent='Login as Staff'}}document.querySelector('.roles button').click()</script></body></html>
